description = "Deny unbounded async-IO read accumulators without a `take(MAX + 1)` cap."
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = { git = "https://github.com/trailofbits/dylint.git", rev = "2c20d164e06c446de2cecadff0c55e16a877c006" }

[package.metadata.rust-analyzer]
rustc_private = true

[lints]
workspace = true
