[package]
name = "sibling_option_fields"
description = "Detect structs with 2+ sibling `Option<T>` fields that should be a closed enum."
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = { git = "https://github.com/trailofbits/dylint.git", rev = "2c20d164e06c446de2cecadff0c55e16a877c006" }

[package.metadata.rust-analyzer]
rustc_private = true

[lints]
workspace = true
