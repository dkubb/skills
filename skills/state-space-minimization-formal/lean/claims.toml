# claims.toml — the inventory and single source of truth for the
# state-space-minimization-formal REFLECTION.
#
# One [[claim]] row per formal symbol, inference rule, and
# guarantee-bearing claim reflected from the calculus that `../SKILL.md`
# OWNS. The Lean project is a DERIVED, NON-NORMATIVE reflection;
# `../SKILL.md` is normative and, if the two disagree, SKILL.md is
# right. This file is what `check_claims` enforces, and the gate is
# LEAN-INTERNAL: it never reads `../SKILL.md`, so claim ids are stable
# Lean-side identifiers, NOT tags the gate matches against the prose.
#
# Schema per row:
#   id                     stable claim id (Lean-side)
#   statement              the calculus claim (tight paraphrase)
#   rank                   one of:
#                            kernel-theorem | kernel-definition |
#                            export-seal | runtime-bridge |
#                            operator-policy | evaluator-judgment |
#                            honest-doc
#   lean_module            module the decl lives in (for non-residual)
#   lean_decl              the Lean declaration discharging it
#                          (empty ONLY if residual)
#   expected_type          the decl's pinned type (required for every
#                          non-residual row). `check_claims` rebuilds
#                          the env cache-disabled, prints the real
#                          decl's type with `#check @<decl>` under
#                          `pp.fullNames`, collapses whitespace, and
#                          compares it to this string. A mismatch FAILS
#                          the gate — so gutting a headline to
#                          `: True := trivial` changes its printed type
#                          and the only way to pass is to ALSO edit this
#                          field (a visible, reviewable change). This is
#                          the non-editable replacement for the old
#                          StatementBinding guard.
#   headline               true if this claim carries a rejecting
#                          mutant; corollary/definition rows set false
#   mutant                 mutant file (headline rows only)
#   mutant_result          the compile-failure excerpt (headline rows)
#   residual               true when lean_decl is empty (allowlisted)
#   residual_justification required iff residual=true
#
# Internal version stamps the checker cross-validates (Invariant 5).
# LEAN-INTERNAL ONLY: these tie the lakefile semver, the Reflection.lean
# header, and the README literals together. The reflection is versioned
# independently of `../SKILL.md`; there is no SKILL version stamp here.
version_lakefile = "2026.6.8"
version_header  = "2026-06-v8"

