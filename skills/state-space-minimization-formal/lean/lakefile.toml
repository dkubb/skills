name = "ssm-formal-reflection"
# Tracks ../SKILL.md metadata.version "2026-06-v2" as 2026.6.2.
version = "2026.6.2"
keywords = ["math"]
defaultTargets = ["Reflection"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "Reflection"
